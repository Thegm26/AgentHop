[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenthop"
version = "0.3.0"
description = "Local, provider-neutral AI coding account switcher"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
agenthop = "agenthop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/agenthop"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["agenthop"]
